; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@^6.5.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
; monitor_rts = 1
; monitor_dtr = 1
lib_deps =
  adafruit/Adafruit NeoPixel@^1.15.2
  tbekas/BLE-Gamepad-Client@^0.3.0
  madhephaestus/ESP32Servo@^3.0.6
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0

[env:controller]
extends = env
build_flags =
  ${env.build_flags}
  -DDEVICE_ROLE_CONTROLLER=1

[env:remote]
extends = env
build_flags =
  ${env.build_flags}
  -DDEVICE_ROLE_REMOTE=1


; pour flasher le controller
; ~/.platformio/penv/bin/pio run -e controller -t upload  

; pour flasher le remote
; ~/.platformio/penv/bin/pio run -e remote -t upload  
